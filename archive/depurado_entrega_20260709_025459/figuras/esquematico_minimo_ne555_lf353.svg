<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1400"
     viewBox="0 0 2500 1400">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
          orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
  </marker>
  <style><![CDATA[
  .page { fill:#ffffff; }
  .title { font:700 36px Arial, sans-serif; fill:#0f172a; }
  .subtitle { font:19px Arial, sans-serif; fill:#334155; }
  .box { stroke:#94a3b8; stroke-width:2; fill:#f8fafc; }
  .main { stroke:#2563eb; stroke-width:2.5; fill:#eff6ff; }
  .analog { stroke:#0f766e; stroke-width:2.5; fill:#ecfdf5; }
  .filter { stroke:#7c3aed; stroke-width:2.5; fill:#f5f3ff; }
  .note { stroke:#cbd5e1; stroke-width:1.7; fill:#ffffff; }
  .wire { stroke:#111827; stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .signal { stroke:#2563eb; stroke-width:3.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .rail { stroke:#dc2626; stroke-width:2.6; fill:none; stroke-linecap:round; }
  .node { fill:#111827; }
  .heading { font:700 21px Arial, sans-serif; fill:#111827; }
  .text { font:17px Arial, sans-serif; fill:#111827; }
  .small { font:15px Arial, sans-serif; fill:#334155; }
  .value { font:700 15px Arial, sans-serif; fill:#0f766e; }
]]></style>
</defs>
<rect class="page" x="0" y="0" width="2500" height="1400"/>
<text class="title" x="70" y="65" text-anchor="start">Circuito minimo NE555 + LF353</text><text class="subtitle" x="70" y="100" text-anchor="start">Un solo NE555; LF353 para acondicionamiento, integrador triangular y filtro activo.</text><rect class="main" x="90" y="245" width="390" height="230" rx="10"/><text class="heading" x="108" y="277" text-anchor="start">U1 NE555 astable</text><text class="small" x="108" y="307" text-anchor="start">TRIG = THRES = Cosc</text><text class="small" x="108" y="330" text-anchor="start">Rosc = 31.46 k</text><text class="small" x="108" y="353" text-anchor="start">Cosc = 10 nF</text><text class="small" x="108" y="376" text-anchor="start">Salida: SQ = 2290 Hz</text><text class="value" x="112" y="220" text-anchor="start">+15 V</text><line class="rail" x1="115" y1="225" x2="115" y2="245"/><text class="small" x="318" y="220" text-anchor="start">GND</text><line class="wire" x1="330" y1="225" x2="330" y2="245"/><line class="signal" x1="480" y1="360" x2="650" y2="360" marker-end="url(#arrow)"/><circle class="node" cx="650" cy="360" r="5"/><text class="value" x="535" y="342" text-anchor="start">SQ</text><rect class="analog" x="740" y="145" width="455" height="250" rx="10"/><text class="heading" x="758" y="177" text-anchor="start">Sierra positiva</text><text class="small" x="758" y="207" text-anchor="start">Reset en ambos flancos de SQ</text><text class="small" x="758" y="230" text-anchor="start">Rcharge = 53.6 k</text><text class="small" x="758" y="253" text-anchor="start">Csaw = 10 nF</text><text class="small" x="758" y="276" text-anchor="start">Salida: SAW = 4580 Hz</text><path class="signal" d="M650,360 V270 H740" marker-end="url(#arrow)"/><text class="small" x="665" y="255" text-anchor="start">rama 2f0</text><rect class="analog" x="740" y="505" width="455" height="250" rx="10"/><text class="heading" x="758" y="537" text-anchor="start">Entrada f0/2 + nivel</text><text class="small" x="758" y="567" text-anchor="start">Senal equivalente 0-2 V</text><text class="small" x="758" y="590" text-anchor="start">0-2 V -&gt; -1 V/+1 V</text><text class="small" x="758" y="613" text-anchor="start">LF353 como cambiador de nivel</text><text class="small" x="758" y="636" text-anchor="start">Drive del integrador</text><path class="signal" d="M650,360 V630 H740" marker-end="url(#arrow)"/><text class="small" x="665" y="615" text-anchor="start">rama f0/2</text><rect class="analog" x="1300" y="505" width="420" height="250" rx="10"/><text class="heading" x="1318" y="537" text-anchor="start">Integrador LF353</text><text class="small" x="1318" y="567" text-anchor="start">Rtri = 10.9 k</text><text class="small" x="1318" y="590" text-anchor="start">Ctri = 10 nF</text><text class="small" x="1318" y="613" text-anchor="start">Vtri_pk aprox. 2 V</text><text class="small" x="1318" y="636" text-anchor="start">Salida: TRI = 1145 Hz</text><line class="signal" x1="1195" y1="630" x2="1300" y2="630" marker-end="url(#arrow)"/><rect class="filter" x="1830" y="505" width="560" height="250" rx="10"/><text class="heading" x="1848" y="537" text-anchor="start">Filtro Chebyshev orden 5</text><text class="small" x="1848" y="567" text-anchor="start">fc = 1431.25 Hz</text><text class="small" x="1848" y="590" text-anchor="start">1er orden + Sallen-Key + Sallen-Key</text><text class="small" x="1848" y="613" text-anchor="start">LF353 en etapas activas</text><text class="small" x="1848" y="636" text-anchor="start">Salida: SENO</text><line class="signal" x1="1720" y1="630" x2="1830" y2="630" marker-end="url(#arrow)"/><rect class="note" x="1320" y="145" width="460" height="250" rx="10"/><text class="heading" x="1338" y="177" text-anchor="start">Comparacion LTspice</text><text class="small" x="1338" y="207" text-anchor="start">Cuadrada: 2290.02 Hz vs 2290 Hz</text><text class="small" x="1338" y="230" text-anchor="start">Sierra promedio: 4579.997 Hz vs 4580 Hz</text><text class="small" x="1338" y="253" text-anchor="start">Triangular drive: 1144.999 Hz vs 1145 Hz</text><text class="small" x="1338" y="276" text-anchor="start">Errores casi nulos en frecuencia</text><line class="signal" x1="1195" y1="270" x2="1320" y2="270" marker-end="url(#arrow)"/><rect class="box" x="90" y="920" width="2300" height="290" rx="10"/><text class="heading" x="108" y="952" text-anchor="start">Valores que pasan a la memoria</text><text class="small" x="108" y="982" text-anchor="start">NE555: Rosc=31.46 k, Cosc=10 nF. Sierra: Rcharge=53.6 k, Csaw=10 nF.</text><text class="small" x="108" y="1005" text-anchor="start">Triangular: entrada f0/2 equivalente, cambiador de nivel LF353, Rtri=10.9 k, Ctri=10 nF.</text><text class="small" x="108" y="1028" text-anchor="start">Filtro: Rtop=498 k, Rbot=100 k; R=30.7 k; SK1 R=16.1 k Rf=11.5 k; SK2 R=10.9 k Rf=17.8 k.</text><text class="small" x="108" y="1051" text-anchor="start">Esta version deja calculos directos para cada bloque y evita agregar otro oscilador.</text>
</svg>
