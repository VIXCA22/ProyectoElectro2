<text class="title" x="70" y="62" text-anchor="start">Esquematico - version NE555 sin flip-flop externo</text><text class="subtitle" x="70" y="96" text-anchor="start">Basado en memoria_calculo_sin_flipflop.pdf | X=2, Y=2, Z=9 | f0=2.29 kHz | filtro Chebyshev orden 5</text><text class="subtitle" x="70" y="124" text-anchor="start">Sin fuente ideal de corriente: la sierra usa carga RC por resistencia. La triangular usa un segundo NE555 monoestable.</text><rect class="group" x="70" y="170" width="510" height="465" rx="12"/><text class="section" x="88" y="200" text-anchor="start">1. NE555 astable - onda cuadrada</text><text class="small" x="88" y="228" text-anchor="start">Cosc = 10 nF</text><text class="small" x="88" y="249" text-anchor="start">Rosc = 31.46 kOhm</text><text class="small" x="88" y="270" text-anchor="start">tH = tL = R C ln(2)</text><rect class="ic" x="110" y="305" width="250" height="180" rx="8"/><text class="section" x="235" y="335" text-anchor="middle">U1 NE555</text><text class="small" x="235" y="363" text-anchor="middle">astable</text><text class="small" x="235" y="385" text-anchor="middle">Vcc = 15 V</text><line class="wire" x1="85" y1="360" x2="110" y2="360" /><text class="pin" x="118" y="364" text-anchor="start">TRIG</text><line class="wire" x1="85" y1="390" x2="110" y2="390" /><text class="pin" x="118" y="394" text-anchor="start">THRES</text><line class="wire" x1="85" y1="420" x2="110" y2="420" /><text class="pin" x="118" y="424" text-anchor="start">GND</text><line class="wire" x1="85" y1="450" x2="110" y2="450" /><text class="pin" x="118" y="454" text-anchor="start">RESET</text><line class="wire" x1="360" y1="360" x2="385" y2="360" /><text class="pin" x="352" y="364" text-anchor="end">OUT</text><line class="wire" x1="360" y1="390" x2="385" y2="390" /><text class="pin" x="352" y="394" text-anchor="end">DISCH</text><line class="wire" x1="360" y1="420" x2="385" y2="420" /><text class="pin" x="352" y="424" text-anchor="end">CONT</text><line class="wire" x1="360" y1="450" x2="385" y2="450" /><text class="pin" x="352" y="454" text-anchor="end">VCC</text><line class="wire" x1="395" y1="360" x2="411" y2="360" /><polyline class="symbol" points="411,360 429.0,350 447.0,370 465.0,350 483.0,370 501.0,350 519,360" /><line class="wire" x1="519" y1="360" x2="535" y2="360" /><text class="tiny" x="465.0" y="342" text-anchor="middle">Rosc</text><text class="value" x="465.0" y="391" text-anchor="middle">31.46 k</text><line class="wire" x1="235" y1="410" x2="235" y2="468.5" /><line class="wire" x1="235" y1="486.5" x2="235" y2="545" /><line class="symbol" x1="217" y1="468.5" x2="253" y2="468.5" /><line class="symbol" x1="217" y1="486.5" x2="253" y2="486.5" /><text class="tiny" x="259" y="472.5" text-anchor="start">Cosc</text><text class="value" x="259" y="490.5" text-anchor="start">10 nF</text><line class="wire" x1="235" y1="545" x2="235" y2="559" /><line class="ground" x1="221" y1="559" x2="249" y2="559" /><line class="ground" x1="226" y1="566" x2="244" y2="566" /><line class="ground" x1="231" y1="573" x2="239" y2="573" /><line class="wire" x1="460" y1="455" x2="460" y2="503.5" /><line class="wire" x1="460" y1="521.5" x2="460" y2="570" /><line class="symbol" x1="442" y1="503.5" x2="478" y2="503.5" /><line class="symbol" x1="442" y1="521.5" x2="478" y2="521.5" /><text class="tiny" x="484" y="507.5" text-anchor="start">Cctrl</text><text class="value" x="484" y="525.5" text-anchor="start">10 nF</text><line class="wire" x1="460" y1="570" x2="460" y2="584" /><line class="ground" x1="446" y1="584" x2="474" y2="584" /><line class="ground" x1="451" y1="591" x2="469" y2="591" /><line class="ground" x1="456" y1="598" x2="464" y2="598" /><rect class="note" x="499.0" y="336" width="82" height="34" rx="7"/><text class="small" x="540" y="360" text-anchor="middle">SQ f0</text><path class="wire" d="M385,360 C425,360 425,360 395,360" /><rect class="analog" x="660" y="170" width="580" height="465" rx="12"/><text class="section" x="678" y="200" text-anchor="start">2. Diente de sierra positivo</text><text class="small" x="678" y="228" text-anchor="start">Reset en ambos flancos de SQ</text><text class="small" x="678" y="249" text-anchor="start">Detectores RC: Cedge=220 pF, Redge=10 k</text><text class="small" x="678" y="270" text-anchor="start">Diodos 1N4148 y Qreset=2N3904</text><text class="small" x="678" y="291" text-anchor="start">Rcharge = 53.6 kOhm, Csaw = 10 nF</text><path class="bus" d="M580,360 H690 V382 H700" marker-end="url(#arrow-blue)"/><text class="small" x="630" y="342" text-anchor="middle">SQ</text><rect class="note" x="700" y="335" width="145" height="95" rx="12"/><text class="section" x="718" y="365" text-anchor="start">Inversor</text><text class="small" x="718" y="393" text-anchor="start">2N3904</text><text class="small" x="718" y="414" text-anchor="start">SQ_INV</text><rect class="note" x="875" y="320" width="170" height="140" rx="12"/><text class="section" x="893" y="350" text-anchor="start">Flancos</text><text class="small" x="893" y="378" text-anchor="start">2 x RC</text><text class="small" x="893" y="399" text-anchor="start">2 x 1N4148</text><text class="small" x="893" y="420" text-anchor="start">pulso reset</text><rect class="note" x="1070" y="340" width="130" height="110" rx="12"/><text class="section" x="1088" y="370" text-anchor="start">Descarga</text><text class="small" x="1088" y="398" text-anchor="start">Qreset</text><text class="small" x="1088" y="419" text-anchor="start">2N3904</text><line class="wire" x1="760" y1="535" x2="776" y2="535" /><polyline class="symbol" points="776,535 815.6666666666666,525 855.3333333333334,545 895.0,525 934.6666666666666,545 974.3333333333333,525 1014,535" /><line class="wire" x1="1014" y1="535" x2="1030" y2="535" /><text class="tiny" x="895.0" y="517" text-anchor="middle">Rcharge</text><text class="value" x="895.0" y="566" text-anchor="middle">53.6 k</text><line class="wire" x1="1100" y1="485" x2="1100" y2="536.0" /><line class="wire" x1="1100" y1="554.0" x2="1100" y2="605" /><line class="symbol" x1="1082" y1="536.0" x2="1118" y2="536.0" /><line class="symbol" x1="1082" y1="554.0" x2="1118" y2="554.0" /><text class="tiny" x="1124" y="540.0" text-anchor="start">Csaw</text><text class="value" x="1124" y="558.0" text-anchor="start">10 nF</text><line class="wire" x1="1100" y1="605" x2="1100" y2="619" /><line class="ground" x1="1086" y1="619" x2="1114" y2="619" /><line class="ground" x1="1091" y1="626" x2="1109" y2="626" /><line class="ground" x1="1096" y1="633" x2="1104" y2="633" /><path class="bus" d="M845,382 H875 M1045,390 H1070" marker-end="url(#arrow-blue)"/><line class="wire" x1="1030" y1="535" x2="1100" y2="535" /><rect class="note" x="1151.5" y="511" width="87" height="34" rx="7"/><text class="small" x="1195" y="535" text-anchor="middle">SAW 2f0</text><rect class="group" x="70" y="700" width="725" height="470" rx="12"/><text class="section" x="88" y="730" text-anchor="start">3. NE555 monoestable - divisor por 2</text><text class="small" x="88" y="758" text-anchor="start">La salida del monoestable ignora el siguiente disparo</text><text class="small" x="88" y="779" text-anchor="start">T0 = 1/f0 = 436.68 us</text><text class="small" x="88" y="800" text-anchor="start">tw = 1.05 T0 = 458.52 us</text><path class="bus" d="M540,360 V675 H140 V790" marker-end="url(#arrow-blue)"/><rect class="ic" x="120" y="820" width="250" height="180" rx="8"/><text class="section" x="245" y="850" text-anchor="middle">U2 NE555</text><text class="small" x="245" y="878" text-anchor="middle">monoestable</text><text class="small" x="245" y="900" text-anchor="middle">divisor por 2</text><line class="wire" x1="95" y1="875" x2="120" y2="875" /><text class="pin" x="128" y="879" text-anchor="start">TRIG</text><line class="wire" x1="95" y1="905" x2="120" y2="905" /><text class="pin" x="128" y="909" text-anchor="start">THRES</text><line class="wire" x1="95" y1="935" x2="120" y2="935" /><text class="pin" x="128" y="939" text-anchor="start">GND</text><line class="wire" x1="95" y1="965" x2="120" y2="965" /><text class="pin" x="128" y="969" text-anchor="start">RESET</text><line class="wire" x1="370" y1="875" x2="395" y2="875" /><text class="pin" x="362" y="879" text-anchor="end">OUT</text><line class="wire" x1="370" y1="905" x2="395" y2="905" /><text class="pin" x="362" y="909" text-anchor="end">DISCH</text><line class="wire" x1="370" y1="935" x2="395" y2="935" /><text class="pin" x="362" y="939" text-anchor="end">CONT</text><line class="wire" x1="370" y1="965" x2="395" y2="965" /><text class="pin" x="362" y="969" text-anchor="end">VCC</text><line class="wire" x1="420" y1="875" x2="436" y2="875" /><polyline class="symbol" points="436,875 469.0,865 502.0,885 535.0,865 568.0,885 601.0,865 634,875" /><line class="wire" x1="634" y1="875" x2="650" y2="875" /><text class="tiny" x="535.0" y="857" text-anchor="middle">Rdiv</text><text class="value" x="535.0" y="906" text-anchor="middle">41.7 k</text><line class="wire" x1="280" y1="925" x2="280" y2="983.5" /><line class="wire" x1="280" y1="1001.5" x2="280" y2="1060" /><line class="symbol" x1="262" y1="983.5" x2="298" y2="983.5" /><line class="symbol" x1="262" y1="1001.5" x2="298" y2="1001.5" /><text class="tiny" x="304" y="987.5" text-anchor="start">Cdiv</text><text class="value" x="304" y="1005.5" text-anchor="start">10 nF</text><line class="wire" x1="280" y1="1060" x2="280" y2="1074" /><line class="ground" x1="266" y1="1074" x2="294" y2="1074" /><line class="ground" x1="271" y1="1081" x2="289" y2="1081" /><line class="ground" x1="276" y1="1088" x2="284" y2="1088" /><rect class="note" x="652.5" y="851" width="105" height="34" rx="7"/><text class="small" x="705" y="875" text-anchor="middle">QDIV f0/2</text><rect class="analog" x="855" y="700" width="595" height="470" rx="12"/><text class="section" x="873" y="730" text-anchor="start">4. Nivel + integrador triangular</text><text class="small" x="873" y="758" text-anchor="start">Duty real del divisor: 52.45 %</text><text class="small" x="873" y="779" text-anchor="start">Nivel: 0 V -&gt; -1.105 V, 15 V -&gt; +1.000 V</text><text class="small" x="873" y="800" text-anchor="start">entrada del integrador con promedio cero</text><path class="bus" d="M795,875 H880" marker-end="url(#arrow-blue)"/><rect class="note" x="895" y="835" width="180" height="115" rx="12"/><text class="section" x="913" y="865" text-anchor="start">Cambiador</text><text class="small" x="913" y="893" text-anchor="start">LF353</text><text class="small" x="913" y="914" text-anchor="start">k=0.1403</text><text class="small" x="913" y="935" text-anchor="start">Vref=1.105 V</text><polygon class="opamp" points="1160,825 1160,930 1285,877.5" /><text class="text" x="1177" y="861" text-anchor="start">-</text><text class="text" x="1177" y="905" text-anchor="start">+</text><text class="section" x="1223" y="875" text-anchor="middle">U3</text><text class="tiny" x="1223" y="895" text-anchor="middle">LF353</text><line class="wire" x1="1285" y1="877.5" x2="1323.5" y2="877.5" /><line class="wire" x1="1341.5" y1="877.5" x2="1380" y2="877.5" /><line class="symbol" x1="1323.5" y1="859.5" x2="1323.5" y2="895.5" /><line class="symbol" x1="1341.5" y1="859.5" x2="1341.5" y2="895.5" /><text class="tiny" x="1332.5" y="852.5" text-anchor="middle">Ctri</text><text class="value" x="1332.5" y="912.5" text-anchor="middle">10 nF</text><path class="wire" d="M1380,877.5 V780 H1160 V857" /><line class="wire" x1="1160" y1="901" x2="1090" y2="901" /><line class="wire" x1="1090" y1="901" x2="1090" y2="915" /><line class="ground" x1="1076" y1="915" x2="1104" y2="915" /><line class="ground" x1="1081" y1="922" x2="1099" y2="922" /><line class="ground" x1="1086" y1="929" x2="1094" y2="929" /><rect class="note" x="1369.0" y="853.5" width="82" height="34" rx="7"/><text class="small" x="1410" y="877.5" text-anchor="middle">TRI</text><rect class="filter" x="1320" y="170" width="1060" height="465" rx="12"/><text class="section" x="1338" y="200" text-anchor="start">5. Filtro pasabajas Chebyshev de orden 5</text><text class="small" x="1338" y="228" text-anchor="start">Tabla de la presentacion: etapas 1 + 2 + 2</text><text class="small" x="1338" y="249" text-anchor="start">a,b: (2.7600,0), (1.2296,2.0975), (0.2162,0.9655)</text><text class="small" x="1338" y="270" text-anchor="start">Q = sqrt(b)/a,  fn = fc/sqrt(b),  fc = 1431.25 Hz</text><text class="small" x="1338" y="291" text-anchor="start">Bode: |H(1145 Hz)|=-11.12 dB, |H(3435 Hz)|=-62.29 dB</text><path class="bus" d="M1410,877 H1265 V465 H1360" marker-end="url(#arrow-blue)"/><rect class="note" x="1360" y="405" width="145" height="120" rx="12"/><text class="section" x="1378" y="435" text-anchor="start">Atenuador</text><text class="small" x="1378" y="463" text-anchor="start">Rtop=498 k</text><text class="small" x="1378" y="484" text-anchor="start">Rbot=100 k</text><rect class="note" x="1530" y="405" width="140" height="120" rx="12"/><text class="section" x="1548" y="435" text-anchor="start">1er orden</text><text class="small" x="1548" y="463" text-anchor="start">R=30.7 k</text><text class="small" x="1548" y="484" text-anchor="start">C=10 nF</text><rect class="note" x="1695" y="385" width="235" height="160" rx="12"/><text class="section" x="1713" y="415" text-anchor="start">Sallen-Key 1</text><text class="small" x="1713" y="443" text-anchor="start">R1=R2=16.1 k</text><text class="small" x="1713" y="464" text-anchor="start">C1=C2=10 nF</text><text class="small" x="1713" y="485" text-anchor="start">Rg=10 k</text><text class="small" x="1713" y="506" text-anchor="start">Rf=11.5 k</text><rect class="note" x="1960" y="385" width="235" height="160" rx="12"/><text class="section" x="1978" y="415" text-anchor="start">Sallen-Key 2</text><text class="small" x="1978" y="443" text-anchor="start">R1=R2=10.9 k</text><text class="small" x="1978" y="464" text-anchor="start">C1=C2=10 nF</text><text class="small" x="1978" y="485" text-anchor="start">Rg=10 k</text><text class="small" x="1978" y="506" text-anchor="start">Rf=17.8 k</text><path class="bus" d="M1505,465 H1530 M1670,465 H1695 M1930,465 H1960 M2195,465 H2300" marker-end="url(#arrow-blue)"/><rect class="note" x="2284.0" y="441" width="82" height="34" rx="7"/><text class="small" x="2325" y="465" text-anchor="middle">SENO</text><rect class="group" x="1510" y="700" width="870" height="470" rx="12"/><text class="section" x="1528" y="730" text-anchor="start">Salidas para la memoria</text><text class="small" x="1528" y="758" text-anchor="start">V(sq): cuadrada central a f0</text><text class="small" x="1528" y="779" text-anchor="start">V(saw): diente de sierra positivo a 2f0</text><text class="small" x="1528" y="800" text-anchor="start">V(tri): triangular a f0/2</text><text class="small" x="1528" y="821" text-anchor="start">V(sine): salida senoidal filtrada</text><text class="small" x="1528" y="842" text-anchor="start">Alimentacion: +15 V para NE555; +/-15 V para LF353</text><rect class="note" x="2209.0" y="786" width="82" height="34" rx="7"/><text class="small" x="2250" y="810" text-anchor="middle">SQ</text><rect class="note" x="2209.0" y="856" width="82" height="34" rx="7"/><text class="small" x="2250" y="880" text-anchor="middle">SAW</text><rect class="note" x="2209.0" y="926" width="82" height="34" rx="7"/><text class="small" x="2250" y="950" text-anchor="middle">TRI</text><rect class="note" x="2209.0" y="996" width="82" height="34" rx="7"/><text class="small" x="2250" y="1020" text-anchor="middle">SENO</text><rect class="note" x="70" y="1230" width="2310" height="260" rx="12"/><text class="section" x="88" y="1260" text-anchor="start">Notas de calculo usadas en el dibujo</text><text class="small" x="88" y="1288" text-anchor="start">Astable NE555: Rosc = 1/(2 f0 Cosc ln(2)).</text><text class="small" x="88" y="1309" text-anchor="start">Sierra RC: Rcharge = -Tsaw/(Csaw ln(1 - Vsaw/Vcc)); no se usa fuente ideal de corriente.</text><text class="small" x="88" y="1330" text-anchor="start">Monoestable NE555: tw = 1.1 Rdiv Cdiv y se elige tw &gt; T0 para dividir por 2.</text><text class="small" x="88" y="1351" text-anchor="start">Filtro: se usan coeficientes tabulados a_i, b_i de Chebyshev y las relaciones de la materia para Q y frecuencia natural.</text>
</svg>
